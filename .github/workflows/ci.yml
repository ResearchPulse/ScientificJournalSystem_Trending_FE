name: CI

on:
  push:
    branches:
      - main
      - dev
      - feat/CI_CD-action
  pull_request:
    branches:
      - main
      - dev
      - feat/CI_CD-action

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

