name: CI/CD Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint and Test
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_CORE_URL: ${{ vars.VITE_API_CORE_URL }}
      VITE_ARTICLE_GRAPH_ENDPOINT: ${{ vars.VITE_ARTICLE_GRAPH_ENDPOINT }}
      VITE_PARENT_ORIGIN: ${{ vars.VITE_PARENT_ORIGIN }}
      VITE_RAG_CHAT_URL: ${{ vars.VITE_RAG_CHAT_URL }}
      VITE_PAGE_BASE_URL: ${{ vars.VITE_PAGE_BASE_URL }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test --if-present

  docker:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leduycoder/scientificjournalsystem-trending-fe:latest
            ghcr.io/leduycoder/scientificjournalsystem-trending-fe:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_CORE_URL=${{ vars.VITE_API_CORE_URL }}
            VITE_ARTICLE_GRAPH_ENDPOINT=${{ vars.VITE_ARTICLE_GRAPH_ENDPOINT }}
            VITE_PARENT_ORIGIN=${{ vars.VITE_PARENT_ORIGIN }}
            VITE_RAG_CHAT_URL=${{ vars.VITE_RAG_CHAT_URL }}
            VITE_PAGE_BASE_URL=${{ vars.VITE_PAGE_BASE_URL }}

  deploy:
    name: Deploy to VPS
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/apps/researchpulse-trending-fe

            echo "Pull latest Docker image..."
            docker-compose pull trending-frontend

            echo "Recreate frontend container..."
            docker-compose up -d --force-recreate trending-frontend

            echo "Remove unused images..."
            docker image prune -f
